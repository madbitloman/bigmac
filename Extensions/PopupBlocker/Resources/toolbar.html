<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BigMac Pop-up and YouTube Blocker</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <main>
    <header>
      <img src="icon-48.png" alt="" width="24" height="24">
      <h1>Pop-up Blocker</h1>
    </header>
    <p id="site" class="site">…</p>
    <p id="count" class="count"></p>
    <label id="row" class="row" hidden>
      <span id="label">Always allow pop-ups on this site</span>
      <input id="allow" type="checkbox" role="switch">
    </label>
    <p id="note" class="note"></p>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="toolbar.js"></script>
</body>
</html>
